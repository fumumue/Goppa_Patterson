name: Build and test

on:
  push:
    branches:
      - 20261023-op-eradication
  pull_request:
    branches:
      - 20261023-op-eradication
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build
        run: make clean && make
      - name: Unit tests
        run: make test
